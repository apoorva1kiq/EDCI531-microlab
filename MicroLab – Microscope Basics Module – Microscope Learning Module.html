    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

<body>
  <div id="__bundler_placeholder">Loading MicroLab – Microscope Basics Module...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

: 12px; border: none; background: #357A29; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer\">Next part<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 class=\"h2big\" style=\"margin: 6px 0 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 24px\">Three big ideas<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px\">\n<div style=\"padding: 20px; background: #F5F8F2; border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-weight: 700; font-size: 18px\">1. Magnifications multiply<\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 8px; background: #F0F7EC; border-radius: 12px; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; color: #245A1C; font-size: 22px\">\n<span>10×<\u002Fspan><span style=\"font-size: 18px\">×<\u002Fspan><span>40×<\u002Fspan><span style=\"font-size: 18px\">=<\u002Fspan><span style=\"padding: 2px 10px; background: #357A29; color: #FFFFFF; border-radius: 8px\">400×<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size: 15px; color: #4E5B48\">Eyepiece × objective = total.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; background: #F5F8F2; border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-weight: 700; font-size: 18px\">2. The image is flipped<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<div style=\"flex: 1 1 0; padding: 8px; background: #F7F9F5; border-radius: 12px; text-align: center\"><div style=\"font-size: 13px; color: #5A6655\">Slide<\u002Fdiv><div style=\"font-size: 44px; font-weight: 700; line-height: 1.1\">e<\u002Fdiv><\u002Fdiv>\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#357A29\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0  border-radius: 50%; border: 3px dashed #C3DFB8\"><\u002Fdiv><div style=\"font-weight: 700; font-size: 15px\">400×<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"color: #DDE8D6; font-size: 15px\">Under each sketch, note one thing you can see that you couldn’t at the power before.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<div style=\"display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; border-top: 1px solid #E4E9E0\">\n<button sc-camel-on-click=\"{{goPrev}}\" disabled=\"{{noPrev}}\" style=\"display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 18px; border-radius: 14px; border: 2px solid #357A29; background: #FFFFFF; color: #357A29; font-size: 16px; font-weight: 700; cursor: pointer\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n{{prevLabel}}\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{goNext}}\" disabled=\"{{noNext}}\" style=\"display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 18px; border-radius: 14px; border: none; background: #357A29; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer\">\n{{nextLabel}}\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{lab}}\" hint-placeholder-val=\"{{false}}\">\n<main style=\"max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px\">\n<div>\n<div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #7A4605\">Lab Mode<\u002Fdiv>\n<h1 class=\"h1big\" style=\"margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 28px; line-height: 1.1\">Using the compound microscope<\u002Fh1>\n<\u002Fdiv>\n<nav aria-label=\"Procedure steps\" style=\"display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px\">\n<sc-for list=\"{{labDots}}\" as=\"d\" hint-placeholder-count=\"8\">\n<button sc-camel-on-click=\"{{d.go}}\" aria-label=\"{{d.aria}}\" aria-current=\"{{d.cur}}\" style=\"height: 44px; padding: 0; border-radius: 12px; border: 2px solid {{d.bd}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 16px; font-weight: 700; cursor: pointer\">{{d.num}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fnav>\n<sc-if value=\"{{labActive}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"padding: 24px; background: #FFFFFF; border: 2px solid #1B2B17; border-radius: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px\">\n<div style=\"flex: 0 1 300px; margin: 0 auto; box-sizing: border-box; display: flex; justify-content: center; padding: 18px; background: #F0F7EC; border-radius: 18px\">\n<dc-import name=\"Illo\" kind=\"{{labIllo}}\" px=\"260\" hint-size=\"260px,260px\"><\u002Fdc-import>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<div>\n<div>\n<div style=\"font-size: 14px; font-weight: 700; color: #5A6655\">Step {{labNum}} of 8<\u002Fdiv>\n<h2 class=\"h2big\" style=\"margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.15\">{{labTitle}}<\u002Fh2>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 20px; line-height: 1.45\">{{labDo}}<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n<button sc-camel-on-click=\"{{listenLab.go}}\" aria-pressed=\"{{listenLab.pressed}}\" style=\"align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 16px 6px 12px; border-radius: 999px; border: 2px solid #357A29; background: {{listenLab.bg}}; color: {{listenLab.fg}}; font-size: 15px; font-weight: 700; cursor: pointer\">\n<sc-if value=\"{{listenLab.speaking}}\" hint-placeholder-val=\"{{false}}\"><span class=\"eq\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{listenLab.idle}}\" hint-placeholder-val=\"{{true}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H2v6h4l5 4V5Z\"><\u002Fpath><path d=\"M15.5 8.5a5 5 0 0 1 0 7\"><\u002Fpath><path d=\"M19 5a10 10 0 0 1 0 14\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n{{listenLab.label}}\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{toggleAuto}}\" aria-pressed=\"{{autoPressed}}\" style=\"display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 14px; border-radius: 999px; border: 2px solid {{autoBd}}; background: {{autoBg}}; color: #1B2B17; font-size: 14px; font-weight: 700; cursor: pointer\">\n<span style=\"width: 34px; height: 20px; box-sizing: border-box; border-radius: 999px; background: {{autoTrack}}; padding: 2px; display: flex; justify-content: {{autoJustify}}\"><span style=\"width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF\"><\u002Fspan><\u002Fspan>\nRead each step aloud\n<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: #FFF9E6; border: 2px solid #EDD27A; border-radius: 16px; color: #3D2A0A\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A35A06\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n<div><div style=\"font-weight: 700; font-size: 13px; color: #7A4605; text-transform: uppercase; letter-spacing: 0.06em\">Avoid<\u002Fdiv><div style=\"font-size: 17px\">{{labMistake}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{labTeacherCheck}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"pop\" role=\"note\" style=\"display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: #EDF6E8; border: 2px solid #357A29; border-radius: 16px\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#357A29\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><path d=\"M5 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0\"><\u002Fpath><path d=\"m16 11 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<div><div style=\"font-weight: 700; font-size: 13px; color: #245A1C; text-transform: uppercase; letter-spacing: 0.06em\">Teacher check<\u002Fdiv><div style=\"font-size: 17px\">Got a sharp image at 40×? Raise your hand and show your focused slide to your teacher before you clean up.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\">\n<button sc-camel-on-click=\"{{labPrev}}\" disabled=\"{{labFirst}}\" style=\"flex: 1 1 0; min-height: 60px; padding: 10px 18px; border-radius: 16px; border: 2px solid #357A29; background: #FFFFFF; color: #357A29; font-size: 18px; font-weight: 700; cursor: pointer\">Back<\u002Fbutton>\n<button sc-camel-on-click=\"{{labNext}}\" style=\"flex: 2 1 0; min-height: 60px; padding: 10px 18px; border-radius: 16px; border: none; background: #357A29; color: #FFFFFF; font-size: 18px; font-weight: 700; cursor: pointer\">{{labNextLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{labFinished}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding: 24px 22px; background: #EDF6E8; border: 2px solid #357A29; border-radius: 22px; display: flex; flex-direction: column; gap: 14px\">\n<h2 class=\"h2big\" style=\"margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 26px\">All 8 steps done. Nice work!<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px\">You just used a compound microscope the way real scientists do. It gets easier every time you focus a new slide.<\u002Fp>\n<div style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 16px; color: #245A1C\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#357A29\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"><\u002Fpath><path d=\"M22 4 12 14.01l-3-3\"><\u002Fpath><\u002Fsvg><span>Didn’t get a sharp image this time? That’s okay. Go back through the steps carefully, one at a time. Focusing a microscope is a hard skill to master, and every try makes you better at it.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<span style=\"padding: 6px 12px; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 700\">4× clicked in<\u002Fspan>\n<span style=\"padding: 6px 12px; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 700\">Slide removed<\u002Fspan>\n<span style=\"padding: 6px 12px; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 700\">Light off<\u002Fspan>\n<span style=\"padding: 6px 12px; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 700\">Cord wrapped<\u002Fspan>\n<span style=\"padding: 6px 12px; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 700\">Cover on<\u002Fspan>\n<span style=\"padding: 6px 12px; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 700\">Carried with two hands<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<button sc-camel-on-click=\"{{labRestart}}\" style=\"min-height: 52px; padding: 8px 20px; border-radius: 14px; border: 2px solid #357A29; background: #FFFFFF; color: #357A29; font-size: 16px; font-weight: 700; cursor: pointer\">Start over<\u002Fbutton>\n<button sc-camel-on-click=\"{{toggleLab}}\" style=\"min-height: 52px; padding: 8px 20px; border-radius: 14px; border: none; background: #357A29; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer\">Back to the lesson<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{party}}\" hint-placeholder-val=\"{{false}}\">\n<div aria-hidden=\"true\">\n<sc-for list=\"{{confetti}}\" as=\"cf\" hint-placeholder-count=\"0\"><span class=\"confetti\" style=\"left: {{cf.x}}%; width: {{cf.w}}px; background: {{cf.c}}; animation-delay: {{cf.d}}s\"><\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}\">\nvar SECTIONS = ['Look Closer','Goals', 'Warm-up', 'Parts', 'How-to', 'Practice', 'Scenarios', 'Quiz', 'Lab Time'];\n\nvar IC = {\n  hand: 'M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2 M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2 M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8 M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15',\n  zoomOut: 'M3 11a8 8 0 1 0 16 0a8 8 0 1 0-16 0 M21 21l-4.3-4.3 M8 11h6',\n  slide: 'M2 9h20v6H2z M10 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0',\n  eye: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',\n  rotate: 'M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8 M21 3v5h-5',\n  sun: 'M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M12 2v2 M12 20v2 M4.93 4.93l1.41 1.41 M17.66 17.66l1.41 1.41 M2 12h2 M20 12h2 M6.34 17.66l-1.41 1.41 M19.07 4.93l-1.41 1.41',\n  crosshair: \n    d: 'Set the slide on the stage with the specimen facing up. Center the specimen over the hole in the stage and hold the slide with the stage clips.',\n    lab: 'Put the slide on the stage, specimen up. Center it over the hole and secure it with the stage clips.',\n    why: 'Light comes up through the hole, so the specimen must sit right above it.',\n    m: 'Leaving the specimen off-center. You’ll see a bright, empty circle.' },\n  { t: 'Close the gap, watching from the side', icon: IC.eye,\n    d: 'Look at the microscope from the side, not through the eyepiece. Turn the coarse knob to bring the stage and the objective close together without letting them touch.',\n    lab: 'Watch from the SIDE. Turn the coarse knob to bring the objective and slide close together, without touching.',\n    why: 'From the side you can see the gap. Through the eyepiece you can’t.',\n    m: 'Closing the gap while looking through the eyepiece. Slides crack this way.' },\n  { t: 'Focus with the coarse knob', icon: IC.rotate,\n    d: 'Now look through the eyepiece. Slowly turn the coarse knob the other way, moving the objective and slide apart, until the specimen comes into view.',\n    lab: 'Now look through the eyepiece. Slowly turn the coarse knob to move them APART until the specimen appears.',\n    why: 'Moving apart means the lens can never crash into the slide.',\n    m: 'Spinning the knob fast. You’ll zoom right past the focus.' },\n  { t: 'Sharpen and adjust the light', icon: IC.sun,\n    d: 'Turn the fine knob until the image is crisp. Then adjust the diaphragm until the brightness and contrast look best.',\n    lab: 'Turn the fine knob until the image is sharp. Adjust the diaphragm until the brightness looks right.',\n    why: 'Pale specimens show more contrast with less light.',\n    m: 'Light on full blast. Pale cells wash out and seem to disappear.' },\n  { t: 'Center, then zoom in', icon: IC.crosshair,\n    d: 'Move the slide so your specimen is in the exact center of th        num: i + 1, illo: ILLOS[i], t: st.t, how: st.lab, why: st.why, m: st.m, icon: st.icon, open: open,\n        expanded: open ? 'true' : 'false', chev: open ? 'rotate(180deg)' : 'none',\n        bd: open ? TEAL : '#E4E9E0',\n        toggle: function () { self.setState({ gOpen: open ? -1 : i }); self.sfx('tick'); }\n      };\n    });\n\n    // 6. Practice: order\n    var score = 0;\n    s.order.forEach(function (idx, pos) { if (idx === pos) score++; });\n    var orderItems = s.order.map(function (idx, pos) {\n      var ok = idx === pos, chk = s.orderChecked, dragging = s.dragFrom === pos;\n      return {\n        posNum: pos + 1, label: STEPS[idx].t, icon: STEPS[idx].icon,\n        showStatus: chk, status: ok ? 'Correct' : 'Move',\n        statusFg: ok ? TEAL : '#B4410C',\n        bg: dragging ? '#FEF3C7' : (chk ? (ok ? '#EDF6E8' : '#FDEDEA') : '#FFFFFF'),\n        bd: dragging ? '#B7791F' : (chk ? (ok ? TEAL : '#C2410C') : '#DCE3D6'),\n        upDis: pos === 0, downDis: pos === 7,\n        upAria: 'Move “' + STEPS[idx].t + '” up', downAria: 'Move “' + STEPS[idx].t + '” down',\n        up: function () { self.move(pos, pos - 1); },\n        down: function () { self.move(pos, pos + 1); },\n        dragStart: function (e) {\n          self.setState({ dragFrom: pos });\n          try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(pos)); } catch (err) {}\n        },\n        dragOver: function (e) { e.preventDefault(); },\n        drop: function (e) { e.preventDefault(); self.move(self.state.dragFrom, pos); },\n        dragEnd: function () { if (self.state.dragFrom != null) self.setState({ dragFrom: null }); }\n      };\n    });\n    var perfect = score === 8;\n\n    // 6. Practice: calculator\n    function optBtn(val, cur, key) {\n      var sel = val === cur;\n      return {\n        label: val + '×', pressed: sel ? 'true' : 'false',\n        bg: sel ? TEAL : '#FFFFFF', fg: sel ? '#FFFFFF' : '#1B2B17', bd: sel ? TEAL : '#DCE3D6',\n        pick: function () { var o = {}; o[key] = val; self.setState(o); self.sfx('tick'); }\n      };\n    }\n    var eyeOpts = [10, 15].map(function (v) { return optBtn(v, s.eye, 'eye'); });\n    var objOpts = [4, 10, 40, 100].map(function (v) { return optBtn(v, s.obj, 'obj'); });\n    var objNotes = {\n      4: 'Scanning: widest view. Always start here.',\n      10: 'Low power: find and center your specimen.',\n      40: 'High power: fine knob only.',\n      100: 'Oil immersion: rarely used in school labs.'\n    };\n    var total = s.eye * s.obj;\n    var apparent = Math.round(0.05 * total * 10) / 10;\n    var cellPx = Math.min(Math.max(0.05 * total * 4.5, 6), 460);\n\n    // 7. Scenarios\n    var scens = SCENARIOS.map(function (sc, i) {\n      var picked = s.scen[i], has = picked != null, right = picked === sc.ans;\n      return {\n        num: i + 1, q: sc.q, cap: sc.cap, hasPick: has,\n        v1: sc.view === 1, v2: sc.view === 2, v3: sc.view === 3,\n        fbTitle: right ? 'Good call' : 'Not the best choice',\n        fbText: has ? sc.opts[picked].f : '',\n        fbBg: right ? '#EDF6E8' : '#FDEDEA', fbBd: right ? TEAL : '#C2410C', fbFg: right ? '#245A1C' : '#7C2D12',\n        opts: sc.opts.map(function (o, j) {\n          var sel = picked === j;\n          return {\n            letter: 'ABC'.charAt(j), text: o.t, pressed: sel ? 'true' : 'false',\n            bg: sel ? (right ? '#EDF6E8' : '#FDEDEA') : '#FFFFFF',\n            bd: sel ? (right ? TEAL : '#C2410C') : '#DCE3D6',\n            cls: sel ? (right ? 'pop' : 'shake') : '',\n            pick: function () { var n = Object.assign({}, s.scen); n[i] = j; self.setState({ scen: n }); self.sfx(j === sc.ans ? 'good' : 'bad'); }\n          };\n        })\n      };\n    });\n\n    // 8. Quiz\n    var answered = Object.keys(s.quiz).length;\n    var qScore = 0;\n    QUIZ.forEach(function (q, i) { if (s.quiz[i] === q.ans) qScore++; });\n    var qs = QUIZ.map(function (q, i) {\n      var mine = s.quiz[i], right = mine === q.ans;\n      return {\n        num: i + 1, q: q.q, expl: q.e, result: right ? 'Correct.' : 'Not quite.',\n        opts: q.opts.map(function (t, j) {\n          var sel = mine === j, isAns = j === q.ans, sub = s.submitted;\n          var bg = '#FFFFFF', bd = '#DCE3D6', tag = '', tagFg = TEAL;\n          if (!sub && sel) { bg = '#F0F7EC'; bd = TEAL; }\n          if (sub && isAns) { bg = '#EDF6E8'; bd = TEAL; tag = sel ? 'Your answer · correct' : 'Correct answer'; }\n          if (sub && sel && !isAns) { bg = '#FDEDEA'; bd = '#C2410C'; tag = 'Your answer'; tagFg = '#9A3412'; }\n          return {\n            text: t, bg: bg, bd: bd, tag: tag, tagFg: tagFg, hasTag: tag !== '',\n            pressed: sel ? 'true' : 'false',\n            pick: function () { if (s.submitted) return; var n = Object.assign({}, s.quiz); n[i] = j; self.setState({ quiz: n }); self.sfx('tick'); }\n          };\n        })\n      };\n    });\n    var scoreTitle = qScore === 5 ? 'Perfect score — you’re lab ready!' : (qScore >= 3 ? 'Nice work — almost there.' : 'Keep practicing.');\n    var scoreMsg = qScore === 5 ? 'Head to Lab Time for your in-lab checklist.' : 'Review the explanations, revisit Parts and How-to, then try again.';\n\n    // 9. Checklist\n    var clCount = 0;\n    var cl = CHECK.map(function (t, i) {\n      var on = !!s.cl[i]; if (on) clCount++;\n      return {\n        num: i + 1, text: t, checked: on, bg: on ? '#EDF6E8' : '#F7F9F5',\n        toggle: function () {\n          var n = Object.assign({}, self.state.cl); n[i] = !n[i]; self.setState({ cl: n });\n          var all = CHECK.every(function (x, k) { return n[k]; });\n          if (all) self.celebrate(); else self.sfx('tick');\n        }\n      };\n    });\n\n    // Lab mode\n    var ls = s.labStep;\n    var labDots = STEPS.map(function (st, i) {\n      var cur = !s.labFinished && ls === i, done = s.labFinished || i < ls;\n      return {\n        num: i + 1, aria: 'Step ' + (i + 1) + ': ' + st.t, cur: cur ? 'step' : 'false',\n        bg: cur ? TEAL : (done ? '#F0F7EC' : '#FFFFFF'),\n        fg: cur ? '#FFFFFF' : (done ? TEAL : '#5A6655'),\n        bd: cur || done ? TEAL : '#DCE3D6',\n        go: function () { self.labGo(i); }\n      };\n    });\n\n    function listenVals(key, text) {\n      var on = s.speaking === key;\n      return {\n        speaking: on, idle: !on, label: on ? 'Stop' : 'Listen', pressed: on ? 'true' : 'false',\n        bg: on ? TEAL : '#FFFFFF', fg: on ? '#FFFFFF' : TEAL,\n        go: function () { self.speak(key, text); }\n      };\n    }\n\n    function secText() {\n      var t = '';\n      if (s.sec === 2) {\n        t = 'What will you be able to do? By the end of this module, you will be able to: ' +\n          OBJECTIVES.map(function (o) { return o.verb + ' ' + o.text + '.'; }).join(' ') +\n          ' Keep a microscope, a prepared slide, lens paper and this module at your bench, so you can practice each step as you go.';\n      } else if (s.sec === 3) {\n        t = 'Before we zoom in. Three quick questions. Lock in your answer, then tap to check. ' +\n          RECALL.map(function (r, i) { return 'Question ' + (i + 1) + '. ' + r.q; }).join(' ');\n      } else if (s.sec === 4) {\n        t = 'Parts of the compound microscope. Tap a number on the microscope to learn about each part. Then remember three big ideas. ' +\n          'One: magnifications multiply. A 10× eyepiece and a 40× objective give 400× total. ' +\n          'Two: the image is flipped. Move the slide left, and the image moves right. ' +\n          'Three: more power, less view. The image gets smaller and dimmer as you zoom in, so open the diaphragm for more light.';\n      } else if (s.sec === 5) {\n        t = 'The 8-step procedure. First, the golden rule of focusing. With your eye at the side, close the gap without touching. Then, with your eye at the eyepiece, focus only by moving them apart. ';\n        if (s.gOpen >= 0 && STEPS[s.gOpen]) {\n          var st = STEPS[s.gOpen];\n          t += 'Step ' + (s.gOpen + 1) + ': ' + st.t + '. Do: ' + st.lab + ' Why: ' + st.why + ' Avoid: ' + st.m;\n        } else {\n          t += 'Tap any step to open it.';\n        }\n      } else if (s.sec === 6) {\n        t = s.prac === 'B'\n          ? 'Practice B: the magnification calculator. Pick an eyepiece and an objective lens. Right now, ' + s.eye + '× times ' + s.obj + '× equals ' + (s.eye * s.obj) + '× total magnification.'\n          : 'Practice A: put the steps in order. Drag the cards, or use the arrow buttons, until all 8 steps are in the right order. Then tap Check my order.';\n      } else if (s.sec === 7) {\n        var sc = SCENARIOS[s.scIdx], pk = s.scen[s.scIdx];\n        t = 'What would you do? Scenario ' + (s.scIdx + 1) + '. ' + sc.q + ' ' +\n          sc.opts.map(function (o, j) { return 'Option ' + 'ABC'.charAt(j) + ': ' + o.t; }).join(' ');\n        if (pk != null) t += ' You picked option ' + 'ABC'.charAt(pk) + '. ' + sc.opts[pk].f;\n      } else if (s.sec === 8) {\n        var q = QUIZ[s.qIdx];\n        t = 'Question ' + (s.qIdx + 1) + ' of 5. ' + q.q + ' ' +\n          q.opts.map(function (o, j) { return 'Option ' + 'ABCD'.charAt(j) + ': ' + o + '.'; }).join(' ');\n        if (s.submitted) t += ' ' + (s.quiz[s.qIdx] === q.ans ? 'You got this one right. ' : 'Not quite. ') + q.e;\n      } else if (s.sec === 9) {\n        t = 'Take it to the bench. Your partner checks each skill on the in-lab checklist as you do it. ' +\n          'Your next challenge: find, focus and sketch one specimen at 40×, 100× and 400×. Under each sketch, note one thing you can see that you couldn’t at the power before.';\n      }\n      return t.replace(/µm/g, ' micrometers').replace(/(\\d)×/g, '$1 times').replace(/×/g, 'times');\n    }\n\n    return {\n      learn: learn, lab: !learn,\n      labBtnLabel: learn ? 'Lab Mode' : 'Exit Lab Mode',\n      labBtnBg: learn ? '#F5C542' : '#1B2B17', labBtnFg: learn ? '#1B2B17' : '#FFFFFF',\n      toggleLab: function () {\n 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[r]; a[r] = t; }\n        if (a.every(function (v, i) { return v === i; })) a.reverse();\n        self.setState({ order: a, orderChecked: false });\n      },\n\n      eyeOpts: eyeOpts, objOpts: objOpts, objNote: objNotes[s.obj],\n      eye: s.eye, obj: s.obj, total: total, apparent: apparent,\n      cellPx: Math.round(cellPx), nucPx: Math.round(cellPx * 0.34),\n\n      scens: scens,\n      scenShown: [scens[s.scIdx]],\n      scenTabs: scens.map(function (sc, i) {\n        var cur = s.scIdx === i;\n        return {\n          label: 'Scenario ' + (i + 1), pressed: cur ? 'true' : 'false',\n          bg: cur ? '#FFFFFF' : 'transparent', fg: cur ? '#245A1C' : '#5A6655',\n          go: function () { self.setState({ scIdx: i }); }\n        };\n      }),\n\n      pracA: s.prac === 'A', pracB: s.prac === 'B',\n      pracAp: s.prac === 'A' ? 'true' : 'false', pracBp: s.prac === 'B' ? 'true' : 'false',\n      tabABg: s.prac === 'A' ? '#FFFFFF' : 'transparent', tabAFg: s.prac === 'A' ? '#245A1C' : '#5A6655',\n      tabBBg: s.prac === 'B' ? '#FFFFFF' : 'transparent', tabBFg: s.prac === 'B' ? '#245A1C' : '#5A6655',\n      pickA: function () { self.setState({ prac: 'A' }); },\n      pickB: function () { self.setState({ prac: 'B' }); },\n\n      partPrev: function () { if (self.state.speaking === 'part') self.stopSpeak(); self.setState({ part: PARTS[(selIdx + PARTS.length - 1) % PARTS.length].id }); },\n      partNext: function () { if (self.state.speaking === 'part') self.stopSpeak(); self.setState({ part: PARTS[(selIdx + 1) % PARTS.length].id }); },\n\n      qShown: [qs[s.qIdx]],\n      qDots: qs.map(function (q, i) {\n        var cur = s.qIdx === i, ans = s.quiz[i] != null, ok = s.quiz[i] === QUIZ[i].ans;\n        var bg = '#FFFFFF', fg = '#5A6655', bd = '#DCE3D6';\n        if (ans) { bg = '#F0F7EC'; fg = '#357A29'; bd = '#357A29'; }\n        if (s.submitted) { bg = ok ? '#EDF6E8' : '#FDEDEA'; f
